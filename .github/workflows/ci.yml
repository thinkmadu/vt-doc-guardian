name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Instalar dependências de sistema (libmagic)
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependências do Backend
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-asyncio

    - name: Fazer lint com flake8
      run: |
        cd backend
        flake8 . --exclude=.venv,legacy_cli --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --exclude=.venv,legacy_cli --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Executar testes unitários com pytest
      run: |
        cd backend
        PYTHONPATH=. pytest tests/ -v

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências
      run: |
        cd frontend
        npm install

    - name: Validar regras com ESLint
      run: |
        cd frontend
        npm run lint

    - name: Build de Produção
      run: |
        cd frontend
        npm run build
