name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    permissions:
      contents: write # tag, release e o commit do CHANGELOG
      issues: write # etiquetas do pull request de release
      pull-requests: write # abrir e atualizar o pull request de release
    uses: thinkmadu/automacoes/.github/workflows/release-please.yml@main
    with:
      release-type: python
