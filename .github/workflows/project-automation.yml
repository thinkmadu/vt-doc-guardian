name: Adicionar ao Project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions: {}

jobs:
  add:
    uses: thinkmadu/automacoes/.github/workflows/add-to-project.yml@main
    with:
      project-url: https://github.com/users/thinkmadu/projects/2
    secrets:
      # PAT classic só com `project`: o repositório é público, e qualquer
      # pessoa dispara este job abrindo uma issue.
      project-token: ${{ secrets.PROJECT_TOKEN }}
