name: CI

# A lógica mora em thinkmadu/automacoes; aqui ficam só as diferenças deste
# repositório em relação ao padrão.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    uses: thinkmadu/automacoes/.github/workflows/ci-python.yml@main
    with:
      python-version: "3.12"
      working-directory: backend
      install: uv pip install -r requirements.txt flake8
      # A primeira passada barra erro de sintaxe e nome indefinido; a segunda
      # só reporta complexidade e linha longa, sem falhar.
      lint: |
        flake8 . --extend-exclude .venv --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --extend-exclude .venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      format: ""
      test: ""

  frontend:
    uses: thinkmadu/automacoes/.github/workflows/ci-node.yml@main
    with:
      working-directory: frontend
      # O eslint acusa 3 `no-explicit-any` em src/app/page.tsx; o CI anterior
      # não rodava lint no frontend. Volta quando esses três forem tipados.
      lint: ""
